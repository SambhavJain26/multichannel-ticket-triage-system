name: Quality & Workflow Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Validate n8n Workflow JSON
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = "workflows";
            const files = fs.readdirSync(dir).filter(f => f.endsWith(".json") && f !== "canvas-layouts.json");
            let totalNodes = 0;
            for (const file of files) {
              const fullPath = path.join(dir, file);
              const data = JSON.parse(fs.readFileSync(fullPath, "utf8"));
              if (!Array.isArray(data.nodes)) {
                throw new Error(`${file} missing nodes array`);
              }
              totalNodes += data.nodes.length;
              console.log(`✓ ${file}: valid JSON (${data.nodes.length} nodes)`);
            }
            console.log(`✓ All workflow exports verified. Total nodes: ${totalNodes}`);
          '

      - name: Verify Sanitization & Placeholders
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const checkDir = (dir) => {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  if (entry.name !== "node_modules" && entry.name !== ".git") checkDir(fullPath);
                } else if (entry.name.endsWith(".json") || entry.name.endsWith(".js") || entry.name.endsWith(".md")) {
                  const content = fs.readFileSync(fullPath, "utf8");
                  if (/pat[a-zA-Z0-9]{20,}/.test(content) && !content.includes("patXXXXXXXXXXXXXX")) {
                    throw new Error(`Potential real token detected in ${fullPath}`);
                  }
                  if (/sk-[a-zA-Z0-9]{20,}/.test(content) && !content.includes("sk-placeholder")) {
                    throw new Error(`Potential real OpenAI key detected in ${fullPath}`);
                  }
                }
              }
            };
            checkDir(".");
            console.log("✓ Credential hygiene check passed: zero raw credentials detected.");
          '
